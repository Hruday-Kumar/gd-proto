<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PlaceMe · GD Arena — Spike</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <!-- ── Join / consent screen ─────────────────────────────── -->
    <section id="join-screen" class="card">
      <h1>GD Arena <span class="tag">spike</span></h1>
      <p class="muted">A quick test room to prove live audio + per-speaker transcription.</p>

      <label>Your name
        <input id="name" type="text" placeholder="e.g. Priya" autocomplete="off" />
      </label>
      <label>Room code
        <input id="room" type="text" placeholder="e.g. gd-test-1" autocomplete="off" />
      </label>

      <!-- CONSENT GATE — mic cannot be enabled until this is checked.
           (Guardrail: never enable a mic without recorded consent.) -->
      <label class="consent">
        <input id="consent" type="checkbox" />
        <span>I consent to my microphone being recorded and transcribed for this
          practice session.</span>
      </label>

      <button id="join-btn" disabled>Join room</button>
      <p id="join-error" class="error" hidden></p>
      <p class="fineprint">Use Chrome or Edge. For a real multi-speaker test, have 3+
        people join the same room code (headphones recommended to avoid echo).</p>
    </section>

    <!-- ── Live room screen ──────────────────────────────────── -->
    <section id="room-screen" class="hidden">
      <header class="room-header">
        <div>
          <strong id="room-name-label"></strong>
          <span class="muted" id="you-label"></span>
        </div>
        <div class="controls">
          <button id="mic-btn" class="ghost">🎙️ Mic on</button>
          <button id="leave-btn" class="danger">Leave</button>
        </div>
      </header>

      <div class="grid">
        <aside class="panel">
          <h2>In the room</h2>
          <ul id="participants"></ul>
        </aside>

        <main class="panel">
          <h2>Live transcript <span class="muted">(attributed per speaker)</span></h2>
          <div id="transcript"></div>
          <div id="interim" class="interim muted"></div>
        </main>
      </div>
    </section>
  </div>

  <!-- Remote audio elements are attached here -->
  <div id="audio-sink" aria-hidden="true"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
